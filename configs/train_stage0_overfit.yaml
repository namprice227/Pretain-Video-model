model_config: configs/model_vieth3_debug_20m.yaml
cache_index: data/cached_latents/index.jsonl
output_dir: outputs/stage0_overfit
strategy: single
bf16: false
gradient_checkpointing: false
batch_size: 2
grad_accum: 1

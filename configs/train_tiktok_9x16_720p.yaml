model_config: configs/model_vieth3_tiktok_9x16_mini.yaml
cache_index: data/cached_tiktok_720p/index.jsonl
output_dir: outputs/tiktok_9x16_720p
strategy: fsdp
bf16: true
gradient_checkpointing: true
batch_size: 1
grad_accum: 16
max_steps: 20000
warmup_steps: 500
lr: 5.0e-5
min_lr: 1.0e-5
weight_decay: 0.01
flow_shift: 7.0
cfg_dropout: 0.1
i2v_dropout: 0.1
pose_dropout: 0.15
use_ema: false
log_every: 25
save_every: 2000
num_workers: 4
seed: 42

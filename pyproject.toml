[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vieth3"
version = "0.1.0"
description = "VietH3: H3-inspired single-stream Omni-DiT video generation pretraining pipeline for Vietnamese data on 2x H100 GPUs"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "torch>=2.3.0",
    "safetensors>=0.4.3",
    "pyyaml>=6.0.1",
    "numpy>=1.26.0",
    "pillow>=10.3.0",
    "tqdm>=4.66.0",
    "einops>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
data = [
    "opencv-python-headless>=4.9.0",
    "scenedetect>=0.6.3",
    "httpx>=0.27.0",
]
hf = [
    "transformers>=4.45.0",
    "diffusers>=0.31.0",
    "accelerate>=0.34.0",
    "huggingface_hub>=0.25.0",
]
cuda = [
    "bitsandbytes>=0.44.0",
    "wandb>=0.17.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
